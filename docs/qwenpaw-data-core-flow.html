<div class="say green"><b>默认安全姿势：</b>--workspace 默认 docker（分析代码在容器里跑），--permission-mode auto 在容器内等效 bypass、本地退化为 accept_edits。</div>

function switchTab(tab){
  curTab = tab;
  document.getElementById('tab-run').className   = tab === 'run'   ? 'on' : '';
  document.getElementById('tab-build').className = tab === 'build' ? 'on' : '';
  renderMap();
  document.getElementById('hint').textContent = '点击图中任意方块，展开它内部的子流程、输入输出数据结构与代码位置';

function pick(id){
  if(!NODES[id]) return;
  document.querySelectorAll('.nd').forEach(function(n){ n.classList.remove('sel'); });
  const el = document.getElementById(id);
  if(el) el.classList.add('sel');
  document.getElementById('detail').innerHTML = NODES[id];
  const t = el ? el.querySelector('text').textContent : id;
  document.getElementById('hint').textContent = '当前在看：' + t;
  document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'nearest'});
}
