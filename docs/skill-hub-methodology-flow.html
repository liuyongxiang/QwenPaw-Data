"c5": `<div class="panel wf">
<h2>④ 维度下拆（3.2）<span class="tag tg-wf">方法编排</span></h2>
<p class="lead">三段式下拆法：单维扫描 → 平级交叉 → 层级下钻，每一步同时算贡献度与分布占比，层层收窄定位关键维度（组）值。</p>
<div class="sec"><div class="h">三段式子流程</div><div class="steps">
<div class="st in"><b>单维扫描</b><span>每个 0 级维度逐一算贡献度+占比 → Top-N 异常维度值集合 D1</span></div>
<span class="arw">→</span>
<div class="st br"><b>交叉分析</b><span>D1 中多个平级维度异常 → 两两组合再算 → D2；单维度异常则跳过</span></div>
<span class="arw">→</span>
<div class="st out"><b>层级下钻</b><span>沿父子层级在异常值范围内逐级向下（0→1→2 级），直到无更下级；每级结果保留用于汇总</span></div>
</div></div>
<div class="sec"><div class="h">真实走法示例（SKILL.md 原例）</div>
<pre class="data">单维扫描:  渠道=自然流量 +45% · 端类型=APP +30%           → D1
交叉分析:  自然流量 × APP +38%                             → D2
层级下钻:  渠道下有子渠道 → 自然流量×APP 内 子渠道=搜索引擎 +32%  → 定位
默认参数:  N=3；某方向变动量 &gt; 整体变动 30% → 正/负贡献分离各取 Top-N</pre></div>
<div class="say warn"><b>正负抵消是归因第一大坑：</b>整体只涨 2%，但 +45% 和 -43% 同时存在——默认按总贡献排序会把真凶排到后面；30% 阈值触发正负分离。</div>
<div class="sec"><div class="h">技能位置</div><p style="margin:2px 0"><code>skills/atomic/bi-dimension-drilldown/SKILL.md</code></p></div>
</div>`,

"c6": `<div class="panel atom">
<h2>⑤ 贡献度计算<span class="tag tg-atom">Atomic</span></h2>
<p class="lead">贡献度算法按指标类型分四路：量值两法、率值/加权平均两法——指标类型选错方法，贡献度就是错的。</p>
<div class="sec"><div class="h">方法选择表（contribution_calc.py 的 --method）</div>
<pre class="data">量值指标（维度间可加: DAU / GMV / 订单量）
  quantity-standard  标准法（默认）: 维度增量 / 总增量
  quantity-separate  正负分离法: 抵消严重时（&gt;30%）正负各归一化
率值 / 加权平均指标（转化率 / 留存率 / 客单价）
  ratio-cross-term   保留交叉项（默认）: 结构效应+水平效应+交互效应
  ratio-average      平均权重法: 消掉交互项，只留结构与水平两项
脚本: python scripts/contribution_calc.py \
        --dimension 渠道 端类型 \        <em># 多列 = 交叉分析</em>

        --method quantity-standard \
        [--numerator-* --denominator-* 四列]  <em># 率值/加权指标必填</em></pre></div>
<div class="sec"><div class="h">输出示例（真实格式）</div>
<pre class="data">标准法:   渠道  往期  当期  增量   贡献度

交叉项法: 品类  结构效应  水平效应  交互效应  总贡献

<div class="say"><b>率值指标的贡献度不是「各维度率值变化」：</b>必须拆成结构（权重变了）/ 水平（值变了）/ 交互（一起变）三效应，否则加总对不上总变动。</div>

<pre class="data">复用优先: 同一数据只取一次 · 中间结果直接引用（口径/时间一致才可复用）
自排障:   分析原因 → 第1轮调参重试 → 第2轮替代方案（换等价指标/表/粒度）
          → 仍失败: 非关键→跳过并标注 · 关键→求助（附已试方案+阻塞点+建议）
数据异常: 单项缺→跳过标注 · 大面积缺→按可用产出+标注局限 · 核心全缺→终止
计算异常: 保留结果+标注原因，不静默丢弃、不用默认值替代
结果矛盾: 全部保留+列可能原因（口径/时间/数据源），不替用户取舍
新线索:   与目标直接相关→追 · 显著且可快验证→追 · 无关→记录"建议后续深入"</pre></div>

<div class="st"><b>完整性</b><span>未完成项列原因</span></div>
<span class="arw">→</span>
<div class="st out"><b>约束遵守</b><span>用户要求/域知识/plan/skill 规则</span></div>
</div></div>
<div class="sec"><div class="h">技能位置</div><p style="margin:2px 0"><code>skills/runtime/runtime-guide/SKILL.md §2</code></p></div>

/* 面板内嵌小 SVG 的节点/箭头助手（NODES 求值时即调用，靠函数声明提升可用） */
function mn(cls, x, y, w, h, title, subs){
  const cx = x + w / 2;
  let s = '<g class="mn ' + cls + '"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="7"/>'
    + '<text x="' + cx + '" y="' + (y + 26) + '" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#22333d">' + title + '</text>';
  (subs || []).forEach(function(t, i){
    s += '<text x="' + cx + '" y="' + (y + 44 + i * 17) + '" text-anchor="middle" font-size="10.5" fill="#66757f">' + t + '</text>';
  });
  return s + '</g>';
}
function tri(x, y, dir, c){ // 箭头头部，(x,y) 为尖端坐标
  c = c || '#93a5b3';
  const d = { r: 'M ' + x + ' ' + y + ' l -7 -3.2 l 0 6.4 z',
              l: 'M ' + x + ' ' + y + ' l 7 -3.2 l 0 6.4 z',
              d: 'M ' + x + ' ' + y + ' l -3.2 -7 l 6.4 0 z',
              u: 'M ' + x + ' ' + y + ' l -3.2 7 l 6.4 0 z' }[dir];
  return '<path d="' + d + '" fill="' + c + '"/>';
}

const TAB_DESC = {
  pan:  '分层全景：Meta 入口 → L0 意图路由（六类任务）→ L1 分析规划（缺信息先问）→ 取数与五阶段工作流 → 交付；底部灰色带是贯穿全程的横切纪律（页签③展开）',
  loop: 'bi-metric-analysis：一个分析条目的完整循环 —— 对每个北极星指标依次执行 3.1–3.4，无异常则跳过 3.2/3.3 直达 3.4',
  gov:  '横切纪律不属于任何单一环节——它们约束每一步：怎么问用户、怎么落盘、怎么排障、怎么对待口径和数字',
};

let curTab = 'pan';

const DEFS = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" '
  + 'markerHeight="6" orient="auto-start-reverse">'
  + '<path d="M 0 0 L 10 5 L 0 10 z" fill="#93a5b3"/></marker>';

function renderMap(){
  document.getElementById('map').innerHTML =
    '<defs>' + DEFS + '</defs>' + (curTab === 'pan' ? PAN_SVG : curTab === 'loop' ? LOOP_SVG : GOV_SVG);
  document.getElementById('map').setAttribute('viewBox',
    curTab === 'pan' ? '0 0 1280 540' : curTab === 'loop' ? '0 0 1280 470' : '0 0 1280 375');
}

function switchTab(tab){
  curTab = tab;
  document.getElementById('tab-pan').className  = tab === 'pan'  ? 'on' : '';
  document.getElementById('tab-loop').className = tab === 'loop' ? 'on' : '';
  document.getElementById('tab-gov').className  = tab === 'gov'  ? 'on' : '';
  document.getElementById('tabdesc').textContent = TAB_DESC[tab] || '';
  renderMap();
  document.getElementById('hint').textContent = '点击图中任意方块，展开它内部的子流程、数据契约与坑点提示';
  document.getElementById('detail').innerHTML = '';
}

function pick(id){
  if(!NODES[id]) return;
  document.querySelectorAll('.nd').forEach(function(n){ n.classList.remove('sel'); });
  const el = document.getElementById(id);
  if(el) el.classList.add('sel');
  document.getElementById('detail').innerHTML = NODES[id];
  const t = el ? el.querySelector('text').textContent : id;
  document.getElementById('hint').textContent = '当前在看：' + t;
  document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'nearest'});
}

document.addEventListener('DOMContentLoaded', function(){ switchTab('pan'); });
