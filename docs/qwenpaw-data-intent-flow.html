<h1>QwenPaw-Data 意图识别流程（可下钻）</h1>
<div class="sub">从用户一句话到可执行分析计划 · 纯 SKILL 规则驱动的多级意图识别（无分类模型 / 无向量检索） · 点主流程任意节点，展开子流程、实际契约与代码位置</div>

<div class="tabs">
  <button id="tab-main" class="on" onclick="switchTab('main')">主流程（一句话 → 分析计划）</button>
  <button id="tab-router" onclick="switchTab('router')">L0 判定规则（8 类任务分派）</button>
  <button id="tab-disambig" onclick="switchTab('disambig')">消歧与反问（歧义消除闭环）</button>
</div>

<div class="mapwrap">
  <svg class="main" id="map" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#93a5b3"/>
      </marker>
    </defs>
  </svg>

<script>
const NODES = {
/* ───────────────────────── 主流程 ───────────────────────── */

"u0": `<div class="panel">
<h2>用户请求<span class="tag t-rule">规则判定</span></h2>
<p class="lead">一切从一条自然语言消息开始——没有表单、没有固定槽位，意图识别的全部责任在 SKILL 规则侧。</p>
<div class="sec"><div class="h">输入样例与期望识别结果</div>
<pre class="data">"转化率为什么下降"        <em>→ 2a（BI 业务分析）+ question_type=why</em>
"查一下上月销售额"        <em>→ 1b（数据查询，直接取数）</em>
"看一下这份数据的分布"    <em>→ 2b（数据探索）</em>
"帮我把刚才的分析整理成报告" <em>→ 2e（报告生成，上下文已有结论）</em></pre></div>
<div class="say">识别是概率行为：越口语的请求（"帮我把数据捋一捋"）越依赖技能 <code>description</code> 里的触发词命中——description 是这套体系事实上的路由索引。</div>
<div class="sec"><div class="h">代码位置</div><p style="margin:2px 0">触发词定义在各 <code>SKILL.md</code> frontmatter <code>description</code>（最典型：<code>packages/qwenpaw-data-skills/skills/workflows/fetch-data/SKILL.md</code> 的 5 类触发条件）</p></div>
</div>`,

"a1": `<div class="panel host">
<h2>技能清单装配<span class="tag t-host">宿主装配</span></h2>
<p class="lead">意图识别的「第一级检索索引」在会话开始前就装配好：31 个技能只暴露「名称 + 描述」，模型据此决定读哪个 SKILL.md。</p>
<div class="sec"><div class="h">装配链路（实际代码）</div>
<pre class="data">discover_builtin_skills()
  → skills_root.rglob("SKILL.md")          <em># 扫描全部技能目录</em>
  → parse frontmatter: name + description  <em># 只取这两项做索引</em>
  → BuiltinSkill(name, src_dir, group, description) × 31
  → toolkit: skills_or_loaders=workspace_skills  <em># 挂进 agent 工具组</em></pre></div>
<div class="sec"><div class="h">内部子流程</div><div class="steps">
<div class="st in"><b>扫描</b><span>rglob 全部 SKILL.md</span></div>
<span class="arw">→</span>
<div class="st"><b>解析</b><span>YAML frontmatter → name/description</span></div>
<span class="arw">→</span>
<div class="st"><b>冲突检查</b><span>重名技能直接报错</span></div>
<span class="arw">→</span>
<div class="st out"><b>挂载</b><span>进 agent 工具组，按需 Read 加载</span></div>
</div></div>
<div class="say warn"><b>description 就是路由表：</b><code>fetch-data</code> 的 description 是一份 5 类触发词大清单（索要指标 / 取数口语 / 数据来源 / 问元数据 / 工作区缺数据），本质是给第一级意图匹配用的关键词表——写得越长，召回越稳。</div>
<div class="say">宿主侧另有 <code>biztrace</code>（执行轨迹分段）与 <code>followup</code>（追问推荐）算法模块，属会话观测 / 推荐增强，<b>不参与</b>意图识别主链路。</div>
<div class="sec"><div class="h">代码位置</div><p style="margin:2px 0"><code>packages/qwenpaw-data-host-core/src/qwenpaw_data/host/core/utils/skill.py:64</code>（discover_builtin_skills）· <code>agent/toolkit.py:268</code>（skills_or_loaders）· 技能数断言 <code>tests/test_workspace_skills.py:30</code></p></div>
</div>`,

"a2": `<div class="panel host">
<h2>系统提示约束<span class="tag t-host">宿主装配</span></h2>
<p class="lead">MASTER.md 把「技能在哪、何时必须读、多解怎么办」写进系统提示——意图识别的行为契约在会话最外层。</p>
<div class="sec"><div class="h">与意图识别直接相关的约束</div>
<pre class="data">"Skills 位于 agent workspace 下的 skills/&lt;name&gt;/SKILL.md；
 复杂分析优先读取对应 skill，不要从零手写一套方法"
"多解先确认：……如果仍无法唯一确定用户所指的指标、字段、维度或口径，
 必须先向用户确认，再执行 SQL 或给出数据结论。
 反问时列出所有候选项，并说明每项口径或描述差异"</pre></div>
<div class="say">「多解先确认」与 <code>interaction-strategy</code> 的 Type 1 同源——反问不是可选风格，是系统级纪律，系统提示 + runtime skill 双层强化。另：Plan / Agent 运行模式由界面切换，Plan 模式仅开放规划类工具（<code>create_plan</code> / <code>revise_current_plan</code>）。</div>
<div class="sec"><div class="h">代码位置</div><p style="margin:2px 0"><code>packages/qwenpaw-data-host-core/src/qwenpaw_data/host/core/prompts/MASTER.md:36</code>（分析技能）· <code>:64</code>（多解先确认）· <code>prompts/PLAN_MODE.md</code></p></div>
</div>`,

"h1": `<div class="panel">
<h2>skill-hub-guide（Meta 入口）<span class="tag t-rule">规则判定</span></h2>
<p class="lead">技能仓库总说明书——description 声明「执行任何数据分析任务前必须优先加载」，是意图进入技能体系的第一道门。</p>
<div class="sec"><div class="h">六层技能体系（意图识别相关层加粗）</div>
<table class="mini"><tr><th>层级</th><th>职责</th><th>SKILL</th></tr>
<tr><td><b>L0 路由</b></td><td><b>判定任务类型，分发处理链路</b></td><td><code>data-intent-router</code></td></tr>
<tr><td><b>L1 规划</b></td><td><b>补充上下文、匹配模块和指标，产出结构化计划</b></td><td><code>analysis-plan-builder</code></td></tr>
<tr><td>Workflows</td><td>编排原子技能与取数</td><td><code>fetch-data</code> + 4 条 BI 分析流 + 2 条 DS 流</td></tr>
<tr><td>Atomic</td><td>单一分析动作</td><td>17 个（观测 / 检测 / 归因 / 统计 / 报告）</td></tr>
<tr><td>Runtime</td><td>横切强制规范</td><td><code>runtime-guide</code> · <code>bi-semantic-layer-guide</code> · <code>interaction-strategy</code></td></tr>
<tr><td>Meta</td><td>仓库使用约定</td><td><code>skill-hub-guide</code>（本文件）</td></tr>
</table></div>
<div class="sec"><div class="h">核心原则（对意图识别的约束）</div>
<pre class="data">SKILL 即规范：即使认为可以简化也必须完整遵循
按需调用：禁止一次性预读所有 SKILL，按当前子任务逐个加载
参数优先级：用户显式指定 > 域知识包 > 语义层接口 > SKILL 默认值</pre></div>
<div class="say red"><b>单点风险：</b>若模型没加载这份指南（description 未命中），整个链路约束失效——纯 prompt 体系没有硬性 enforce，靠「必须优先加载」措辞 + MASTER.md 系统提示双保险。</div>
<div class="sec"><div class="h">代码位置</div><p style="margin:2px 0"><code>packages/qwenpaw-data-skills/skills/meta/skill-hub-guide/SKILL.md</code>（含 6 条典型链路图）</p></div>
</div>`,

"r1": `<div class="panel">
<h2>L0 任务类型判定<span class="tag t-rule">规则判定</span></h2>
<p class="lead">意图识别第一道正式判定：8 个任务类型，依次检查、命中即停。</p>
<div class="sec"><div class="h">判定顺序（完整决策树见「L0 判定规则」页签）</div>
<pre class="data">1 查询类（无分析推理）
   1a 元数据查询（字段含义 / 表结构 / 关联关系）
   1b 数据查询（某个值 / 某批记录）
2 分析类（分析 / 建模 / 计算 / 报告）
   2a BI 业务分析 · 2b 数据探索 · 2c 统计建模 · 2d 定量计算 · 2e 报告生成
3 非数据任务（兜底）
边界：复合意图（查数 + 分析）→ 以分析类为准</pre></div>
<div class="sec"><div class="h">内部子流程</div><div class="steps">
<div class="st in"><b>查询类检查</b><span>获取数据 / 定义且无分析推理？</span></div>
<span class="arw">→</span>
<div class="st"><b>分析类检查</b><span>5 个子类逐一对照定义 + 例子</span></div>
<span class="arw">→</span>
<div class="st"><b>非数据兜底</b><span>均不命中</span></div>
<span class="arw">→</span>
<div class="st out"><b>输出类型标签</b><span>决定后续链路</span></div>
</div></div>
<div class="say">整个 SKILL 只有 50 行——规则极简是刻意设计：判定逻辑全部显式写在 prompt 里让模型执行，没有隐藏状态。</div>
<div class="sec"><div class="h">代码位置</div><p style="margin:2px 0"><code>packages/qwenpaw-data-skills/skills/routing/data-intent-router/SKILL.md</code></p></div>
</div>`,

"t1": `<div class="panel">
<h2>任务类型 → 链路分流<span class="tag t-rule">规则判定</span></h2>
<p class="lead">判定结果的消费表：任务类型标签决定走哪条链路、是否经过 L1 规划（意图精化只发生在 L1）。</p>
<div class="sec"><div class="h">6 条链路（hub-guide 定义）</div>
<table class="mini"><tr><th>类型</th><th>链路</th><th>L1 规划</th></tr>
<tr><td>2a BI 业务分析</td><td>plan-builder → fetch-data → bi-metric / retention / conversion / cohort → 报告</td><td>是</td></tr>
<tr><td>2b 数据探索</td><td>plan-builder（探查 + 子任务序列）→ fetch-data → atomic 按计划串接</td><td>是</td></tr>
<tr><td>2c 统计建模</td><td>plan-builder（建模目标 / 特征 / 评估口径）→ bi-clustering / bi-comparison</td><td>是</td></tr>
<tr><td>2d 定量计算</td><td>fetch-data → 直接 atomic（ltv / funnel / conversion / retention …）</td><td>否</td></tr>
<tr><td>2e 报告生成</td><td>直接 bi-report-generation（组织既有结论）</td><td>否</td></tr>
<tr><td>1a / 1b 查询</td><td>fetch-data 直接取数 / 答元数据</td><td>否</td></tr>
</table></div>
<div class="say warn"><b>是否走 L1 是关键分水岭：</b>只有 2a/2b/2c 会做意图精化（业务类型 → 模块 → 指标）；2d 的判定依据是「公式明确」，无需规划正是它被归为简单任务的前提。</div>
<div class="sec"><div class="h">代码位置</div><p style="margin:2px 0"><code>skills/meta/skill-hub-guide/SKILL.md</code>「典型调用链路」节</p></div>
</div>`,

"p1": `<div class="panel">
<h2>L1 精化入口：analysis-plan-builder<span class="tag t-rule">规则判定</span></h2>
<p class="lead">把「要做分析」细化成「具体分析什么」。设计原则「行动优先」：先收集上下文、再规划、最后才决定问不问用户。</p>
<div class="sec"><div class="h">内部子流程（Step 1 上下文构建）</div><div class="steps">
<div class="st in"><b>1.1 资源确认</b><span>有语义层 MCP 立即调用</span></div>
<span class="arw">→</span>
<div class="st"><b>1.2 任务类型分流</b><span>BI → 1.3–1.5；非 BI → 1.6</span></div>
<span class="arw">→</span>
<div class="st"><b>BI：1.3→1.4→1.5</b><span>业务类型 → 模块 → 指标</span></div>
<span class="arw">·</span>
<div class="st"><b>非 BI：1.6</b><span>数据探查代替业务目录</span></div>
<span class="arw">→</span>
<div class="st out"><b>Step 2</b><span>生成结构化计划</span></div>
</div></div>
<div class="sec"><div class="h">跳过规则（意图已显式时不再重复识别）</div>
<pre class="data">前置条件：任务类型已知（L0 输出）
若用户已明确指定指标（如"分析 DAU 变化"）
  → 跳过 1.3 业务识别 与 1.4 范围确认，直接进 1.5 确认指标角色</pre></div>
<div class="say green"><b>「最差体验是一连串提问什么都没做」</b>——所以上下文收集先于提问，且 1.1 要求把语义层发现实时输出到 assistant 消息，用户随时可打断纠偏。</div>
<div class="sec"><div class="h">代码位置</div><p style="margin:2px 0"><code>packages/qwenpaw-data-skills/skills/planning/analysis-plan-builder/SKILL.md</code></p></div>
</div>`,

"c1": `<div class="panel tool">
<h2>1.1 语义层上下文构建<span class="tag t-tool">工具与检索</span></h2>
<p class="lead">规划前先调语义层——能用检索解决的意图歧义，不留给用户。search_context 不是查表，而是 CM（context-manager）服务里一条「LLM + 图检索」七步管线。</p>
<div class="sec"><div class="h">技能侧调用（MCP 工具真实签名）</div>
<pre class="data">search_context(query="5月app端对话用户数怎么样",  <em># 用户原始问题</em>
               domain="产品A",                     <em># 或 scope={"domain":..., "as_of_date":...}</em>
               session_ref=自动注入,               <em># harness 带外注入，LLM 无需填</em>
               relevance_threshold=0.40)           <em># 相关度门槛，默认 0.40</em>
<em># 返回 relevance.status: relevant | low_confidence | no_match（三档硬信号）</em>
get_domain_overview(domain)  <em># search_context 返回不足时补域全貌</em>
无 MCP 语义层工具 → 跳过，直接进 1.2 按任务类型分流</pre></div>
<div class="sec"><div class="h">实现链路（谁在干活）</div>
<pre class="data">MCP 工具 search_context               mcp/cm_server.py:269（HTTP 代理 + 心跳保活）
  → POST /api/v1/cm/search_context    api/cm_api.py:1403（SSE 流式，逐步 progress）
    → 检索管线 _run_pipeline_front     api/ctx_pipeline.py（七步，见下）
    → 响应组装 shape_l1               api/l1_shape.py（primary / alternatives / schema_prompt）
图数据来源: semantic_config 编辑层（SQLite CRUD + Excel 导入）
  → weave 织入 Neo4j（Metric/Dimension/Column/Event/Entity 节点
    + 全文/向量索引 + 策略卡），检索与织入共用同一图库</pre></div>
<div class="sec"><div class="h">内部七步管线（ctx_pipeline，每步有时耗统计）</div><div class="steps">
<div class="st in"><b>⓪ 语义拆分 + 实体扩展</b><span>两个 LLM 并发：问句拆检索 facet / 实体别名扩召回词</span></div>
<span class="arw">→</span>
<div class="st"><b>① 锚点召回</b><span>全文 + 向量按标签检索 → RRF 融合；LLM rerank 精排（与②并发）</span></div>
<span class="arw">→</span>
<div class="st"><b>② 策略卡召回</b><span>每 facet 向量 ANN 召回可复用分析卡 → 阈值 Gate 分可见 / 屏蔽</span></div>
<span class="arw">→</span>
<div class="st"><b>③ 决策 LLM</b><span>task_type + 复用卡 + 在候选边上选路径；可配 ReAct 多轮，失败回退规则选路</span></div>
<span class="arw">→</span>
<div class="st"><b>④ 子图游历</b><span>两跳候选边 ∪ 策略卡子图 ∪ 选中路径取并集；空则加权 BFS 兜底</span></div>
<span class="arw">→</span>
<div class="st"><b>⑤ 指标展开</b><span>Top-4 指标锚点并发 expand_subgraph 补全口径 / 维度 / 表</span></div>
<span class="arw">→</span>
<div class="st out"><b>⑥ 组装</b><span>primary 1–2 张全量语义卡 + alternatives 简引 + schema_prompt</span></div>
</div></div>
<div class="sec"><div class="h">两个关键打分机制</div>
<pre class="data">RRF 锚点融合: Metric / Dimension / Column 各自
  db.index.fulltext.queryNodes + db.index.vector.queryNodes
  → rrf_merge 只按排名融合、不合成分数（原始余弦另存，供 relevance 用）
relevance 三档: soft_text_match（字符 n-gram 覆盖率）与归一化余弦
  （Neo4j (1+cos)/2 重缩放到 [0,1]）按权重融合
  → ≥ 0.40 relevant / ≥ floor low_confidence / 其余 no_match</pre></div>
<div class="sec"><div class="h">返回给规划 LLM 的形态（l1_shape 产出）</div>
<pre class="data">primary_metrics:     1–2 个最相关指标的完整语义卡（口径/公式/维度/表）
alternative_metrics: 次优候选的简短引用（供消歧时列选项）
knowledge_notes:     过阈值的知识片段（上限截断）
schema_prompt:       只用 primary 渲染的指标中心自然语言（alternatives 挂尾行）</pre></div>
<div class="say"><b>选路只喂组装：</b>决策 LLM 选出的路径仅用于 schema_prompt 组装，不做 SQL 规划——SQL 生成是 fetch-data（NL2SQL）的职责，两级各管一段。</div>
<div class="say red"><b>no_match 必须拦截：</b>语义层返回 <code>no_match</code> 表示指标<b>不存在</b>，与「存在但无数据」是两件事——禁止当作 0 或空表继续，禁止绕过语义层自己拼 SQL 造同名指标。</div>
<div class="say">匹配到多个指标时：优先北极星（<code>is_north_star=true</code>）→ 精确名称优先于同义词 → 跨域同名用当前业务域限定。</div>
<div class="sec"><div class="h">代码位置</div><p style="margin:2px 0">技能侧：<code>analysis-plan-builder/SKILL.md</code> Step 1.1 · <code>skills/runtime/bi-semantic-layer-guide/SKILL.md</code>；实现侧（<code>packages/qwenpaw-data-context/src/context_manager/</code>）：<code>mcp/cm_server.py:269</code>（工具）· <code>api/cm_api.py:1403</code>（端点）· <code>api/ctx_pipeline.py</code>（管线）· <code>api/l1_shape.py</code>（组装）· <code>runtime/anchors.py</code>（RRF 召回）· <code>runtime/relevance.py</code>（三档判定）</p></div>
</div>`,

"c2": `<div class="panel">

ToD: 开发者 / 创作者 · 成就感 > 经济回报 · 网络效应强

"c4": `<div class="panel">

<tr><td>2</td><td>域知识包</td><td>包内定义的指标与标注角色</td></tr>

"f4": `<div class="panel">

<table class="mini"><tr><th>场景</th><th>默认</th></tr>

let curTab = 'main';

const DEFS = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" '
  + 'markerHeight="6" orient="auto-start-reverse">'
  + '<path d="M 0 0 L 10 5 L 0 10 z" fill="#93a5b3"/></marker>';

const TABS = {
  main:    { svg: MAIN_SVG,    box: '0 0 1200 600' },
  router:  { svg: ROUTER_SVG,  box: '0 0 1200 660' },
  disambig:{ svg: DISAMBIG_SVG, box: '0 0 1200 530' },
};

function renderMap(){
  const map = document.getElementById('map');
  map.setAttribute('viewBox', TABS[curTab].box);
  map.innerHTML = '<defs>' + DEFS + '</defs>' + TABS[curTab].svg;
}

function switchTab(tab){
  curTab = tab;
  document.getElementById('tab-main').className     = tab === 'main'     ? 'on' : '';
  document.getElementById('tab-router').className   = tab === 'router'   ? 'on' : '';
  document.getElementById('tab-disambig').className = tab === 'disambig' ? 'on' : '';
  renderMap();
  document.getElementById('hint').textContent = '点击上方任意一个方块，展开它内部的子流程、输入输出契约与代码位置';
  document.getElementById('detail').innerHTML = '';
}

function pick(id){
  if(!NODES[id]) return;
  document.querySelectorAll('.nd').forEach(function(n){ n.classList.remove('sel'); });
  const el = document.getElementById('g' + id);
  if(el) el.classList.add('sel');
  document.getElementById('detail').innerHTML = NODES[id];
  const t = el ? el.querySelector('text').textContent : id;
  document.getElementById('hint').textContent = '当前在看：' + t;
  document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'nearest'});
}

document.addEventListener('DOMContentLoaded', function(){ switchTab('main'); });
</script>
