"r1": `<div class="panel">
<h2>① 注册校验<span class="tag t-keep">确定性</span></h2>
<p class="lead">用户在前端填「数据源类型 + 连接信息」——类型下拉与表单字段由 pydantic 配置模型动态渲染，新增类型只改一个文件，前端零改动。</p>
<div class="sec"><div class="h">输入 → 输出（实际数据）</div>
<pre class="data">GET /api/semantic-config/datasource/types   <em>← 表单元数据单点导出</em>
  → {items: [{type: "mysql", label: "MySQL",
              fields: [{name: "host", type: "string", required: true},
                       {name: "password", type: "string", required: true, secret: true}, …]},
             …]}                              <em>← secret 字段前端打码</em>

POST /api/semantic-config/datasource         <em>← 实例：examples/mysql/datasource.example.json</em>
{ "datasource_name": "MySQL Olist - e-commerce demo",
  "datasource_type": "mysql",
  "config": {"host": "127.0.0.1", "port": 3306, "database": "olist_example",
             "user": "root", "password": "123456"} }

validate_config("mysql", config)
  → MysqlConfig.model_validate(config)        <em>← extra="forbid"：多传/拼错 key 直接 400</em>
  → 规范化 dict（落库形态）</pre></div>
<div class="sec"><div class="h">内部子流程</div><div class="steps">
<div class="st in"><b>选类型</b><span>/types 端点动态下拉，8 种类型</span></div>
<span class="arw">→</span>
<div class="st"><b>填 config</b><span>按所选类型的 pydantic schema 逐字段</span></div>
<span class="arw">→</span>
<div class="st"><b>校验</b><span>BadRequestError(400) 带字段级错误信息</span></div>
<span class="arw">→</span>
<div class="st out"><b>交给连测</b><span>② 存盘前先真实连一次</span></div>
</div></div>
<div class="say">8 种类型 5 份模型——StarRocks / Doris / TiDB 与 MySQL 共用 <code>MysqlConfig</code>（线协议兼容）；PG 系 key 叫 <code>dbname</code>、MySQL 系叫 <code>database</code>，命名贴合各自原生驱动。</div>
<div class="sec"><div class="h">代码位置</div><p style="margin:2px 0"><code>semantic_config/routers/datasource_router.py:83</code>（POST 与 /types）· <code>models/datasource_config.py:100</code>（CONFIG_MODEL_BY_TYPE）</p></div>
</div>`,

"r2": `<div class="panel">
<h2>② 连接测试<span class="tag t-keep">确定性</span></h2>
<p class="lead">存盘前后各测一次：用目标类型的原生驱动真实连一次库，再做最轻量的探测——连上 + SELECT 1 即判定成功。</p>
<div class="sec"><div class="h">输入 → 输出（实际数据）</div>
<pre class="data">POST /api/semantic-config/datasource/test-connection
  body: {datasource_type: "mysql", config: {…}}
  → asyncio.to_thread(_test_mysql, cfg)      <em>← 阻塞驱动放线程池</em>
     pymysql.connect(connect_timeout=10) → SELECT 1
     → count(*) FROM information_schema.tables   <em>← 尽力而为，失败不影响判定</em>
  → asyncio.wait_for(…, timeout=15)          <em>← 整体兜底（覆盖 ODPS 等无 connect_timeout 的驱动）</em>

响应: {"success": true,
       "message": "connected to 127.0.0.1:3306/olist_example",
       "tables_found": 3, "elapsed_ms": 42}</pre></div>
<div class="sec"><div class="h">类型 → 连测函数（_TESTER_BY_TYPE 分发）</div>
<pre class="data">postgresql          → _test_postgres   (psycopg)
mysql/starrocks/
doris/tidb          → _test_mysql      (pymysql)     <em>← MySQL 兼容引擎共用探测通道</em>
odps                → _test_odps       (exist_project 最轻鉴权探测)
duckdb / sqlite     → _test_duckdb / _test_sqlite    <em>← 校验文件存在 + 只读打开数表</em></pre></div>
<div class="say warn"><b>表数量是「尽力而为」：</b>账号无 information_schema 权限时 <code>tables_found=null</code>，不影响连接判定。</div>
<div class="say"><b>错误信息双保险脱敏：</b><code>_redact_str</code> 先跑一遍，再把 config 里的 password / access_key 等值逐个替换成 <code>***</code>——防止驱动把凭证回显在报错里。</div>
<div class="sec"><div class="h">代码位置</div><p style="margin:2px 0"><code>semantic_config/services/connection_tester.py:158</code>（_TESTER_BY_TYPE）</p></div>
</div>`,

"r3": `<div class="panel">
<h2>③ 凭证落库<span class="tag t-keep">确定性</span></h2>
<p class="lead">凭证以 JSON 文本存进 semantic_config.db 的 datasource 表——这是全系统唯一的连接信息来源，后续所有连库只从这里读。</p>
<div class="sec"><div class="h">存储与读回（实际数据）</div>
<pre class="data">datasource 表（SQLite）:
  id INTEGER PK · datasource_id TEXT · datasource_type TEXT

读回（executor 连库时）:
  load_datasource_config("mysql-olist-demo")
  → SELECT datasource_type, config FROM datasource
      WHERE (datasource_id = ? OR CAST(id AS TEXT) = ?) AND is_deleted = 0
  → {"host": "127.0.0.1", "port": 3306, "database": "olist_example",
     "user": "root", "password": "***",
     "_datasource_type": "mysql"}              <em>← 附带类型，⑨ 路由的判型依据</em></pre></div>
<div class="say red"><b>「不回退环境变量」是刻意设计：</b>查不到 config 一律失败——宁可报错也不悄悄连错库。另注意注册侧类型枚举是 <code>postgresql</code>、建图侧 registry key 是 <code>postgres</code>，两套词表并存（见「查数路由侧 · 适配机制总览」）。</div>
<div class="sec"><div class="h">代码位置</div><p style="margin:2px 0"><code>context_manager/api/datasource_active_api.py:90</code>（load_datasource_config）· <code>semantic_config/db.py</code></p></div>

"r4": `<div class="panel">
<h2>④ 语义建图（可选）<span class="tag t-keep">确定性</span></h2>
<p class="lead">把数据源的表/列/外键反射进 Neo4j 图谱，供 Agent 生成 SQL 时检索表语义——走独立的 Adapter 框架，与查数侧不共用代码。</p>
<div class="sec"><div class="h">输入 → 输出（实际数据）</div>
<pre class="data">import_runner: get_adapter(request.source, request.datasource_id)
  → registry 按 config.connection.type 查工厂:
      postgres / hologres        → PostgresAdapter
      mysql / starrocks / doris / tidb → MySQLAdapter
      odps → OdpsAdapter · ddl → DDLAdapter(纯文本,不连库) · csv → CSVAdapter
      sqlite / duckdb / bigquery → 各自 Connector
  → adapter.extract_metadata(schemas)
  → PhysicalManifest{db_id, schema, tables, columns, fks}
  → write_physical → Neo4j (:Table/:Column/HAS_COLUMN …)</pre></div>
<div class="sec"><div class="h">内部子流程</div><div class="steps">
<div class="st in"><b>registry 查工厂</b><span>connection.type 字符串 → 适配器</span></div>
<span class="arw">→</span>
<div class="st"><b>反射</b><span>SQLAlchemy inspect 表/列/FK</span></div>

<div class="st"><b>分区键探测</b><span>候选列 ds/dt/stat_date/data_date</span></div>
<span class="arw">→</span>
<div class="st out"><b>写图</b><span>TableRecord/ColumnRecord 进 Neo4j</span></div>
</div></div>
<div class="say"><b>模板方法复用：</b><code>UniversalConnector</code> 把建引擎、连接池（pool_size=5、pool_pre_ping）、inspect 反射放在基类；方言差异下沉到 <code>_engine_url()</code> / <code>_load_column_comments()</code> 等覆写点。</div>

</div>`,

<pre class="data">_guard_sql(sql) → None(放行) | 拒绝原因

1) 白名单: 必须 SELECT / WITH / EXPLAIN / SHOW / VALUES 开头
2) 黑名单: insert|update|delete|drop|truncate|alter|create|grant|revoke|

3) 多语句: 字面量替换后仍含 ";" → 拒绝

/* ═════════════════════════ 运行时 ═════════════════════════ */

let curTab = 'full';

const DEFS = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" '
  + 'markerHeight="6" orient="auto-start-reverse">'
  + '<path d="M 0 0 L 10 5 L 0 10 z" fill="#93a5b3"/></marker>'
  + '<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" '
  + 'markerHeight="6" orient="auto-start-reverse">'
  + '<path d="M 0 0 L 10 5 L 0 10 z" fill="#7fbf8f"/></marker>';

const TABS = {
  full: { svg: FULL_SVG, vb: '0 0 1200 505' },
  gen:  { svg: GEN_SVG,  vb: '0 0 1200 385' },
  route:{ svg: ROUTE_SVG, vb: '0 0 1200 505' },
};

function renderMap(){
  const map = document.getElementById('map');
  map.setAttribute('viewBox', TABS[curTab].vb);
  map.innerHTML = '<defs>' + DEFS + '</defs>' + TABS[curTab].svg;
}

function switchTab(tab){
  curTab = tab;
  document.getElementById('tab-full').className = tab === 'full' ? 'on' : '';
  document.getElementById('tab-gen').className  = tab === 'gen'  ? 'on' : '';
  document.getElementById('tab-route').className = tab === 'route' ? 'on' : '';
  renderMap();
  document.getElementById('hint').textContent = '点击上方任意一个方块，展开它内部的子流程、输入输出数据结构与代码位置';
  document.getElementById('detail').innerHTML = '';
}

function pick(id){
  if(!NODES[id]) return;
  document.querySelectorAll('.nd').forEach(function(n){ n.classList.remove('sel'); });
  const el = document.getElementById('g' + id);
  if(el) el.classList.add('sel');
  document.getElementById('detail').innerHTML = NODES[id];
  const t = el ? el.querySelector('text').textContent : id;
  document.getElementById('hint').textContent = '当前在看：' + t;
  document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'nearest'});
}

document.addEventListener('DOMContentLoaded', function(){ switchTab('full'); });
</script>
